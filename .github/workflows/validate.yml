name: Validate Notebooks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbformat nbconvert

      - name: Validate notebook format
        run: |
          echo "🔍 Validating notebook format..."
          python -c "import nbformat; nbformat.read('prisma_airs_synch.ipynb', as_version=4); print('✅ prisma_airs_synch.ipynb is valid')"
          python -c "import nbformat; nbformat.read('prisma_airs_asynch.ipynb', as_version=4); print('✅ prisma_airs_asynch.ipynb is valid')"

      - name: Check for hardcoded API keys
        run: |
          echo "🔍 Checking for hardcoded secrets..."
          python - <<'EOF'
          import glob, json, re, sys

          # This check used to grep for a literal fragment of one real key. That
          # was wrong twice over: it pasted part of the secret into this file, and
          # the fragment was one character longer than what actually got committed
          # (the notebook masks with [:10]), so it never matched and passed on
          # every push while the key sat in committed output. Match on shape, not
          # on one known value.
          PATTERNS = [
              (re.compile(r"sk-proj-[A-Za-z0-9_-]{10,}"), "OpenAI project key"),
              (re.compile(r"sk-ant-[A-Za-z0-9_-]{10,}"), "Anthropic key"),
              (re.compile(r"AKIA[0-9A-Z]{16}"), "AWS access key id"),
              # Assignment of a long literal to a key/token/secret-ish name, where
              # the value is not obviously a placeholder or an os.getenv call.
              (re.compile(
                  r"""(?ix)
                  (api[_-]?key|token|secret|password)
                  \s*[=:]\s*
                  ["']([A-Za-z0-9]{16,})["']
                  """), "hardcoded credential assignment"),
          ]
          PLACEHOLDER = re.compile(
              r"(?i)your[_-]?|example|placeholder|redacted|dummy|changeme|xxx|test[_-]?key")

          findings = []
          for path in sorted(glob.glob("*.ipynb")):
              nb = json.load(open(path))
              for idx, cell in enumerate(nb.get("cells", [])):
                  blob = "".join(cell.get("source", []))
                  for rx, label in PATTERNS:
                      for m in rx.finditer(blob):
                          if PLACEHOLDER.search(m.group(0)):
                              continue
                          findings.append(f"{path} cell {idx}: {label}")

          if findings:
              print("❌ Possible hardcoded secrets:")
              for f in sorted(set(findings)):
                  print(f"   {f}")
              sys.exit(1)
          print("✅ No hardcoded secrets found")
          EOF

      - name: Check for notebook outputs
        run: |
          echo "🔍 Checking for committed notebook outputs..."

          # Committed outputs are how a real API key prefix, a profile_id and
          # several report_ids ended up public in this repo. Outputs are the
          # actual leak vector, so this fails the build rather than warning.
          python - <<'EOF'
          import glob, json, sys
          dirty = []
          for path in sorted(glob.glob("*.ipynb")):
              nb = json.load(open(path))
              n = sum(len(c.get("outputs", [])) for c in nb.get("cells", [])
                      if c.get("cell_type") == "code")
              if n:
                  dirty.append(f"{path} ({n} output objects)")
          if dirty:
              print("❌ Notebooks contain committed outputs:")
              for d in dirty:
                  print(f"   {d}")
              print("   Clear them with: jupyter nbconvert --clear-output --inplace *.ipynb")
              sys.exit(1)
          print("✅ No committed notebook outputs")
          EOF
          fi

          echo "✅ Output check complete"

      - name: Validate requirements.txt
        run: |
          echo "🔍 Validating requirements.txt..."

          # Check if requirements.txt exists and is not empty
          if [ ! -s requirements.txt ]; then
            echo "❌ requirements.txt is missing or empty!"
            exit 1
          fi

          # Try to install all dependencies
          pip install --dry-run -r requirements.txt

          echo "✅ requirements.txt is valid"

      - name: Check README exists
        run: |
          echo "🔍 Checking documentation..."

          if [ ! -f README.md ]; then
            echo "❌ README.md is missing!"
            exit 1
          fi

          if [ ! -f README_NOTEBOOKS.md ]; then
            echo "⚠️  Warning: README_NOTEBOOKS.md is missing"
          fi

          echo "✅ Documentation check complete"

      - name: Validation summary
        if: success()
        run: |
          echo ""
          echo "✅ All validation checks passed!"
          echo ""
          echo "📋 Summary:"
          echo "  ✅ Notebook format is valid"
          echo "  ✅ No hardcoded secrets detected"
          echo "  ✅ Dependencies are valid"
          echo "  ✅ Documentation exists"
